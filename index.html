<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quickshares.online | Magic File Transfer</title>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primary: #4F46E5; --primary-hover: #4338CA; --bg-glass: rgba(255, 255, 255, 0.7); --text-main: #1E293B; --text-muted: #64748B; --danger: #EF4444; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, system-ui, sans-serif; color: var(--text-main); overflow-x: hidden; }

        /* Animated Mesh Background */
        .animated-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%); background-size: 400% 400%; animation: gradientMove 15s ease infinite; }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* Floating Icons */
        .floating-icons { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
        .float-icon { position: absolute; font-size: 40px; opacity: 0.15; animation: float 8s ease-in-out infinite; }
        .icon-1 { top: 15%; left: 10%; animation-delay: 0s; } .icon-2 { top: 70%; left: 15%; animation-delay: 2s; }
        .icon-3 { top: 20%; right: 15%; animation-delay: 4s; } .icon-4 { top: 75%; right: 10%; animation-delay: 1s; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-30px); } }

        /* Main Container & Glass */
        .app-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .logo { font-size: 32px; font-weight: 800; margin-bottom: 40px; color: #1E293B; letter-spacing: -1px; text-shadow: 0 2px 10px rgba(255,255,255,0.5); }
        .glass-panel { background: var(--bg-glass); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); width: 100%; max-width: 500px; padding: 40px; box-sizing: border-box; }

        /* Navigation & Views */
        .view { display: none; opacity: 0; transition: opacity 0.3s; }
        .view.active { display: block; opacity: 1; animation: fadeIn 0.4s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .split-landing { display: flex; gap: 20px; }
        .split-btn { flex: 1; background: var(--bg-glass); padding: 40px 20px; border-radius: 16px; cursor: pointer; text-align: center; font-size: 18px; font-weight: 600; transition: 0.3s; border: 2px solid transparent; }
        .split-btn:hover { background: rgba(255,255,255,0.9); border-color: var(--primary); transform: translateY(-5px); }
        .split-btn span { display: block; font-size: 48px; margin-bottom: 15px; }

        /* Inputs & Buttons */
        input { width: 100%; padding: 16px; margin: 10px 0; background: rgba(255,255,255,0.8); border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; font-size: 16px; box-sizing: border-box; text-align: center; }
        button.action-btn { background: var(--primary); color: white; border: none; padding: 16px; width: 100%; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 15px; display: flex; justify-content: center; gap: 10px; align-items: center; }
        button.action-btn:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-2px); }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        .back-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: 600; margin-bottom: 20px; }

        /* File List UI */
        .fullscreen-drop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(79, 70, 229, 0.9); z-index: 999; display: none; justify-content: center; align-items: center; color: white; font-size: 32px; font-weight: bold; }
        .file-list { margin: 15px 0; max-height: 200px; overflow-y: auto; }
        .file-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.6); padding: 12px; border-radius: 10px; margin-bottom: 8px; }
        .remove-btn { background: #fee2e2; color: var(--danger); border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .add-more-btn { background: none; border: 2px dashed #cbd5e1; color: var(--text-muted); padding: 12px; width: 100%; border-radius: 10px; cursor: pointer; font-weight: 600; }

        /* Session UI (Timers & QR) */
        .qr-placeholder { background: white; padding: 15px; border-radius: 16px; margin: 20px auto; width: 160px; height: 160px; display: flex; justify-content: center; align-items: center; }
        .otp-display { font-size: 42px; font-weight: 900; color: var(--primary); letter-spacing: 6px; }
        .stats-row { display: flex; justify-content: space-around; background: rgba(255,255,255,0.5); padding: 15px; border-radius: 12px; margin-bottom: 15px; font-weight: bold; }
        .timer-red { color: var(--danger); }

        /* Vault & Preview */
        .vault-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .vault-item { background: white; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .preview-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.95); z-index: 1000; display: none; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .preview-header { display: flex; justify-content: space-between; color: white; }
        .preview-content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px 0; }
        .preview-content img, .preview-content video, .preview-content iframe { max-width: 100%; max-height: 100%; border-radius: 8px; }
        .preview-actions button { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 12px 24px; border-radius: 8px; cursor: pointer; margin: 0 10px; font-size: 16px;}
        .preview-actions button.primary { background: var(--primary); border: none; }

        /* Rocket Animation */
        .rocket { display: inline-block; transition: all 0.3s; }
        .rocket.launching { animation: launch 1.5s forwards; }
        @keyframes launch { 0% { transform: translateY(0) scale(1); } 30% { transform: translateY(5px) scale(1.1); } 100% { transform: translateY(-50px) scale(0.5) opacity(0); } }
    </style>
</head>
<body>

    <!-- Sounds (Using lightweight public CDNs for quick swoosh and dings) -->
    <audio id="sound-upload" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>
    <audio id="sound-unlock" src="https://assets.mixkit.co/active_storage/sfx/2190/2190-preview.mp3" preload="auto"></audio>

    <div class="animated-bg"></div>
    <div class="floating-icons">
        <div class="float-icon icon-1">📄</div><div class="float-icon icon-2">🖼️</div>
        <div class="float-icon icon-3">🎥</div><div class="float-icon icon-4">🔒</div>
    </div>
    <div id="fullscreen-drop" class="fullscreen-drop">DROP FILES TO UPLOAD</div>

    <div class="app-container">
        <div class="logo">Quickshares.online</div>
        <div class="glass-panel">
            
            <!-- View 1: Landing -->
            <div id="view-landing" class="view active">
                <div class="split-landing">
                    <div class="split-btn" onclick="navTo('view-send')"><span>📤</span> Send</div>
                    <div class="split-btn" onclick="navTo('view-receive')"><span>📥</span> Receive</div>
                </div>
            </div>

            <!-- View 2: Send / Select -->
            <div id="view-send" class="view">
                <button class="back-btn" onclick="navTo('view-landing')">← Back</button>
                <div id="file-list-container" class="file-list"></div>
                <input type="file" id="file-input" multiple hidden>
                <button class="add-more-btn" onclick="document.getElementById('file-input').click()">+ Add Files (Max 50MB)</button>
                
                <input type="text" id="sender-pin" maxlength="4" placeholder="Set 4-Digit PIN (e.g. 1234)">
                <input type="number" id="max-downloads" placeholder="Max Downloads (Default: 2)" style="margin-top:0;">
                
                <button id="upload-btn" class="action-btn">
                    <span id="rocket-icon" class="rocket">🚀</span> <span id="upload-text">Upload Securely</span>
                </button>
            </div>

            <!-- View 3: Active Sender Session -->
            <div id="view-active" class="view" style="text-align: center;">
                <h2 style="margin-top:0; color: var(--primary);">Secure Link Active</h2>
                <div class="stats-row">
                    <div>⏱️ <span id="timer" class="timer-red">05:00</span></div>
                    <div>📥 <span id="download-count">0</span> / <span id="download-max">2</span></div>
                </div>
                
                <div style="font-size: 14px; margin-bottom: 5px;">Scan to open, or type:</div>
                <div style="font-size: 13px; color: var(--text-muted); font-weight: bold;">quickshares.online ➔ Receive ➔ Enter PIN & OTP</div>
                
                <div id="qrcode" class="qr-placeholder"></div>
                
                <div>PIN: <strong id="display-pin">----</strong></div>
                <div class="otp-display" id="display-otp">----</div>
                <button class="action-btn" style="background: var(--danger); margin-top: 10px;" onclick="location.reload()">End Session</button>
            </div>

            <!-- View 4: Receive Login -->
            <div id="view-receive" class="view">
                <button class="back-btn" onclick="navTo('view-landing')">← Back</button>
                <h2 style="margin-top:0;">Access Files</h2>
                <input type="text" id="receiver-pin" maxlength="4" placeholder="Enter 4-Digit PIN">
                <input type="text" id="receiver-otp" maxlength="4" placeholder="Enter 4-Digit OTP">
                <button id="verify-btn" class="action-btn">Unlock Vault 🔓</button>
                <p id="receive-status" style="text-align: center; color: var(--danger);"></p>
            </div>

            <!-- View 5: Receiver Vault -->
            <div id="view-vault" class="view">
                <button class="back-btn" onclick="location.reload()">← End Session</button>
                <h2 style="margin-top:0;">File Vault</h2>
                <p style="color: var(--text-muted); font-size: 14px;">Select a file to view or download.</p>
                <div id="vault-grid" class="vault-grid"></div>
            </div>

        </div>
    </div>

    <!-- Fullscreen Preview Modal -->
    <div id="preview-modal" class="preview-modal">
        <div class="preview-header">
            <div id="preview-title" style="font-size: 18px; font-weight: bold;"></div>
            <button class="close-modal" onclick="closePreview()" style="background:none; border:none; color:white; font-size:32px; cursor:pointer;">×</button>
        </div>
        <div class="preview-content" id="preview-content"></div>
        <div class="preview-actions" id="preview-actions" style="display:flex; justify-content:center;"></div>
    </div>

    <!-- Hidden Iframe for Printing -->
    <iframe id="print-frame" style="display:none;"></iframe>

    <script type="module" src="app.js"></script>
</body>
</html>
