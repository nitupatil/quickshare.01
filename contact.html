<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Contact Us | Quickshares.online</title>
  <meta name="description" content="Get in touch with the Quickshares developer team.">
  <link rel="icon" type="image/jpeg" href="https://i.ibb.co/Rpb7JdYS/gemini-svg-1.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg-cream: #FDF9F0; --bg-soft: #F6F2EA; --ink: #1A1A2C; --muted: #7C7C96; --card-bg: #FFFFFF; --card-border: #E8E4DC; --primary: #3F5EFF; --violet: #8B5CF6; --coral: #FF6B6B; --radius-lg: 32px; --radius-md: 20px; --font: 'Manrope', sans-serif; --shadow-card: 0 12px 32px rgba(0, 0, 0, 0.04); }
    body { font-family: var(--font); background: var(--bg-cream); color: var(--ink); line-height: 1.6; }
    
    .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.2; pointer-events: none; z-index: 0; }
    .blob-1 { width: 500px; height: 500px; background: var(--primary); top: -200px; left: -150px; }
    .blob-2 { width: 400px; height: 400px; background: var(--violet); bottom: -150px; right: -100px; }

    .app-container { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 20px; }
    .logo { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.04em; color: var(--ink); margin-bottom: 24px; text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .logo-icon { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: var(--primary); border-radius: 8px; color: white; font-size: 1rem; transform: rotate(-4deg); }
    .logo-text { background: linear-gradient(135deg, var(--primary) 0%, var(--violet) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .glass-panel { background: var(--card-bg); border: 1.5px solid var(--card-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); width: 100%; max-width: 500px; padding: 40px; position: relative; overflow: hidden; text-align: center; }
    .glass-panel::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, var(--primary) 0%, var(--violet) 50%, var(--coral) 100%); opacity: 0.7; }
    
    .back-link { display: block; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 0.9rem; margin-bottom: 24px; transition: color 0.2s; text-align: left; }
    .back-link:hover { color: var(--primary); }
    h1 { font-size: 2rem; font-weight: 900; margin-bottom: 12px; letter-spacing: -0.03em; }
    p { color: var(--ink-soft); font-weight: 500; font-size: 0.95rem; margin-bottom: 24px; }
    
    .contact-box { background: var(--bg-soft); border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 30px 20px; margin-top: 20px; }
    .contact-box span { display: block; font-size: 3rem; margin-bottom: 10px; }
    .email-link { display: inline-block; background: var(--card-bg); color: var(--primary); text-decoration: none; font-weight: 800; padding: 16px 24px; border-radius: 12px; border: 2px solid var(--primary); transition: transform 0.2s, background 0.2s, color 0.2s; letter-spacing: 0.5px; word-break: break-all; margin-bottom: 16px; }
    .email-link:hover { background: var(--primary); color: white; transform: translateY(-2px); }

    /* Action Button */
    .action-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary); color: white; border: none; padding: 18px 24px; width: 100%; border-radius: 14px; font-size: 1.1rem; font-weight: 800; font-family: var(--font); cursor: pointer; text-decoration: none; margin-top: 24px; transition: all 0.3s; box-shadow: 0 6px 20px rgba(63, 94, 255, 0.4); letter-spacing: -0.01em; }
    .action-btn:hover { background: #3550E0; transform: translateY(-3px); box-shadow: 0 10px 28px rgba(63, 94, 255, 0.5); }
  </style>
</head>
<body>
  <div class="blob blob-1"></div><div class="blob blob-2"></div>
  
  <div class="app-container">
    <a href="/" class="logo">
      <span class="logo-icon">✦</span><span class="logo-text">Quickshares</span><span style="color:var(--coral); line-height:0;">.</span>
    </a>

    <div class="glass-panel">
      <a href="/" class="back-link">← back to home</a>
      <h1>Contact Us 📬</h1>
      <p>Have a question, feedback, or found a bug? We'd love to hear from you. Reach out to our developer directly!</p>

      <div class="contact-box">
        <span>👋</span>
        <div style="font-weight: 700; color: var(--muted); margin-bottom: 16px; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px;">Email the Developer</div>
        <a href="mailto:NITISHBADAK14@GMAIL.COM" class="email-link">NITISHBADAK14@GMAIL.COM</a>
      </div>

      <a href="/" class="action-btn">Start Sharing Files ✦</a>
    </div>
  </div>
</body>
</html>
